<rect x="428" y="226" width="388" height="186" rx="14" fill="#171f30"/>
<rect x="448" y="246" width="36" height="28" rx="8" fill="rgba(129,140,248,0.14)"/>
<text x="466" y="265" font-size="13" font-weight="700" fill="#818cf8" text-anchor="middle">04</text>
