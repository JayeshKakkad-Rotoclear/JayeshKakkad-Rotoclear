<text x="92" y="64" font-size="17" font-weight="650" fill="#0f172a">Platform Architecture</text>
<text x="44" y="98" font-size="13.5" font-weight="400" fill="#64748b">Secure industrial IoT platforms, edge device</text>
<text x="44" y="118" font-size="13.5" font-weight="400" fill="#64748b">orchestration, distributed services and workflow</text>
<text x="44" y="138" font-size="13.5" font-weight="400" fill="#64748b">integrations.</text>
<rect x="44" y="168" width="43" height="24" rx="12" fill="#eaeef5"/><text x="65.5" y="184.32" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">IoT</text>
<rect x="93" y="168" width="53" height="24" rx="12" fill="#eaeef5"/><text x="119.5" y="184.32" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Edge</text>
