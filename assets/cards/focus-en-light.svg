<rect x="44" y="246" width="36" height="28" rx="8" fill="rgba(99,102,241,0.10)"/>
<text x="62" y="265" font-size="13" font-weight="700" fill="#6366f1" text-anchor="middle">03</text>
<text x="92" y="266" font-size="17" font-weight="650" fill="#0f172a">Full-Stack Development</text>
<text x="44" y="300" font-size="13.5" font-weight="400" fill="#64748b">Interfaces with SvelteKit, React and TypeScript; APIs</text>
<text x="44" y="320" font-size="13.5" font-weight="400" fill="#64748b">and data with FastAPI, Node.js, PostgreSQL and</text>
