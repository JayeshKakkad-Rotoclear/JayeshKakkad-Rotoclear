<text x="448" y="98" font-size="13.5" font-weight="400" fill="#64748b">Embedded Linux with Yocto and PTXdist, V4L2 and</text>
<text x="448" y="118" font-size="13.5" font-weight="400" fill="#64748b">GStreamer video pipelines, software for ZynqMP and</text>
<text x="448" y="138" font-size="13.5" font-weight="400" fill="#64748b">ARM.</text>
<rect x="448" y="168" width="58" height="24" rx="12" fill="#eaeef5"/><text x="477" y="184.32" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Yocto</text>
