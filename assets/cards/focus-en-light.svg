<rect x="428" y="226" width="388" height="186" rx="14" fill="#f5f7fb"/>
<rect x="448" y="246" width="36" height="28" rx="8" fill="rgba(99,102,241,0.10)"/>
<text x="466" y="265" font-size="13" font-weight="700" fill="#6366f1" text-anchor="middle">04</text>
<text x="496" y="266" font-size="17" font-weight="650" fill="#0f172a">Security Engineering</text>
<text x="448" y="300" font-size="13.5" font-weight="400" fill="#64748b">Threat modeling, secure development and practical</text>
<text x="448" y="320" font-size="13.5" font-weight="400" fill="#64748b">testing with Burp Suite, Nessus, Wireshark and Kali.</text>
